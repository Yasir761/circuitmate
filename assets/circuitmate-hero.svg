  <text x="868" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#BFD2FB">R<tspan dy="4" font-size="10">L</tspan><tspan dy="-4"> = R</tspan><tspan dy="4" font-size="10">th</tspan></text>
  <text x="868" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#BFD2FB">P<tspan dy="4" font-size="10">max</tspan><tspan dy="-4"> = V</tspan><tspan dy="4" font-size="10">th</tspan><tspan dy="-4">² / 4R</tspan><tspan dy="4" font-size="10">th</tspan></text>
  <line x1="850" y1="272" x2="1170" y2="272" stroke="#fff" stroke-opacity=".08"/>
  <rect x="850" y="287" width="116" height="26" rx="7" fill="none" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="864" cy="300" r="2.5" fill="#10B981"/>
