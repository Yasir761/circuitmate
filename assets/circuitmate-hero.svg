  <text x="240" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F5F6F4" letter-spacing="-1.6">CircuitMate</text>
  <text x="241" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#5C8DF3">Your AI lab partner for ECE</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#9AA19C">
    <text x="96" y="270">Upload your ECE notes. Ask questions, understand difficult concepts,</text>
    <text x="96" y="300">solve problems step by step, and practice for exams—with answers</text>
    <text x="96" y="330">grounded in your own study material.</text>
  </g>

  <rect x="96" y="366" width="120" height="30" rx="8" fill="none" stroke="#fff" stroke-opacity=".14"/><text x="156.0" y="385" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9AA19C" letter-spacing=".4">Ask My Notes</text><rect x="228" y="366" width="148" height="30" rx="8" fill="none" stroke="#fff" stroke-opacity=".14"/><text x="302.0" y="385" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9AA19C" letter-spacing=".4">Explain Concepts</text><rect x="388" y="366" width="134" height="30" rx="8" fill="none" stroke="#fff" stroke-opacity=".14"/><text x="455.0" y="385" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9AA19C" letter-spacing=".4">Solve Problems</text><rect x="534" y="366" width="134" height="30" rx="8" fill="none" stroke="#fff" stroke-opacity=".14"/><text x="601.0" y="385" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9AA19C" letter-spacing=".4">Exam Simulator</text>

